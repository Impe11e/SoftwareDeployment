name: CI/CD Pipeline


on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Code & Docker Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lab3/package-lock.json

      - name: Install Dependencies
        run: |
          cd lab3
          npm ci

      - name: Run ESLint for Application Code
        run: |
          cd lab3
          npm run lint

      - name: Run ShellCheck for Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: node_modules lab3/node_modules

      - name: Run Yamllint for Configs
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .github/workflows/yamllint-config.yml
          
  test:
    name: Automated Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: lab3/package-lock.json

      - name: Install Dependencies
        run: |
          cd lab3
          npm ci

      - name: Run Tests with Coverage
        run: |
          cd lab3
          npm run test:coverage

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: lab3/coverage/

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./lab3
          file: ./lab3/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          